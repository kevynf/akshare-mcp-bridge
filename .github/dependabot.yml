version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
      timezone: "Asia/Shanghai"
    allow:
      - dependency-name: "akshare"
      - dependency-name: "mcp"
    ignore:
      - dependency-name: "mcp"
        versions: [">= 2.0.0"]
    cooldown:
      exclude:
        - "akshare"
    # Keep room for PRs that require manual review to coexist with automated
    # ones: a single open manual-review PR used to freeze every dependency
    # update for the whole repository.
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore"
      include: "scope"
