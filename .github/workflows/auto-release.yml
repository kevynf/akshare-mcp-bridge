name: Automatically release version changes

on:
  workflow_run:
    workflows: ["AKBridge automated validation and maintenance"]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       ((github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
        github.event.workflow_run.event == 'schedule'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.prepare.outputs.tag || steps.version.outputs.tag }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Read and validate package version
        id: version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import ast
          import json
          import tomllib
          from pathlib import Path

          package_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tree = ast.parse(Path("src/akbridge/__init__.py").read_text(encoding="utf-8"))
          runtime_version = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          registry = json.loads(Path("server.json").read_text(encoding="utf-8"))
          registry_versions = {registry["version"], registry["packages"][0]["version"]}
          if runtime_version != package_version or registry_versions != {package_version}:
              raise SystemExit(
                  "Version mismatch: "
                  f"package={package_version}, runtime={runtime_version}, registry={registry_versions}."
              )
          print(package_version)
          PY
          )"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Bump the patch version when dependencies changed since the last release
        id: prepare
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${PACKAGE_VERSION}"
          if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} does not exist yet; the release is created below."
            echo "bumped=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # A concurrent run (or an earlier attempt) may already have bumped the
          # version; never produce two release commits for one dependency change.
          git fetch origin "${RELEASE_BRANCH}"
          remote_version="$(git show "FETCH_HEAD:pyproject.toml" | sed -n 's/^version = "\([^"]*\)"$/\1/p')"
          if [[ "${remote_version}" != "${PACKAGE_VERSION}" ]]; then
            echo "${RELEASE_BRANCH} already moved to ${remote_version}; leaving the release to a later run."
            echo "bumped=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          deps_of() { git show "$1:pyproject.toml" | grep -oE '"(akshare|mcp|pandas)(==|>=)[^"]*"' | sort; }
          if [[ "$(deps_of HEAD)" == "$(deps_of "${tag}")" ]]; then
            echo "Dependency pins are unchanged since ${tag}; no automatic release is needed."
            echo "bumped=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          new_version="$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version = "([^"]+)"$', text)
          major, minor, patch = (int(part) for part in match.group(1).split("."))
          print(f"{major}.{minor}.{patch + 1}")
          PY
          )"
          python - "${new_version}" <<'PY'
          import re
          import sys
          from pathlib import Path

          new_version = sys.argv[1]

          def replace_exact(path: str, pattern: str, expected: int, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} replacements, found {count}")
              file.write_text(updated, encoding="utf-8")

          replace_exact(
              "pyproject.toml", r'(?m)^version = "[^"]+"$', 1, f'version = "{new_version}"'
          )
          replace_exact(
              "src/akbridge/__init__.py",
              r'(?m)^__version__ = "[^"]+"$',
              1,
              f'__version__ = "{new_version}"',
          )
          replace_exact("server.json", r'"version": "[^"]+"', 2, f'"version": "{new_version}"')
          PY
          python - <<'PY'
          import ast
          import json
          import tomllib
          from pathlib import Path

          package_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tree = ast.parse(Path("src/akbridge/__init__.py").read_text(encoding="utf-8"))
          runtime_version = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          registry = json.loads(Path("server.json").read_text(encoding="utf-8"))
          registry_versions = {registry["version"], registry["packages"][0]["version"]}
          if runtime_version != package_version or registry_versions != {package_version}:
              raise SystemExit(
                  f"Version mismatch after bump: package={package_version}, "
                  f"runtime={runtime_version}, registry={registry_versions}."
              )
          print(package_version)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/akbridge/__init__.py server.json
          git commit -m "release: prepare v${new_version}"
          git rebase "FETCH_HEAD"
          git push origin "HEAD:${RELEASE_BRANCH}"
          # The release is created from the commit this job just pushed: a push
          # authenticated with GITHUB_TOKEN does not start a new workflow run, so
          # waiting for a follow-up run would leave the bumped version untagged.
          echo "bumped=true" >> "${GITHUB_OUTPUT}"
          echo "tag=v${new_version}" >> "${GITHUB_OUTPUT}"
          echo "release_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "Bumped to v${new_version} and pushed; the release is created from that commit below."
      - name: Create tag and GitHub Release when needed
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag || steps.version.outputs.tag }}
        run: |
          git fetch origin "${RELEASE_BRANCH}" >/dev/null 2>&1
          branch_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "${{ steps.prepare.outputs.bumped }}" == "true" ]]; then
            release_target="${{ steps.prepare.outputs.release_sha }}"
          elif [[ "${branch_sha}" == "${RELEASE_SHA}" ]]; then
            release_target="${RELEASE_SHA}"
          elif git merge-base --is-ancestor "${RELEASE_SHA}" "${branch_sha}"; then
            # Automation commits (for example a refreshed baseline) landed after
            # the validated revision; they were produced by the workflow run that
            # produced this release job.
            release_target="${branch_sha}"
          else
            echo "Skipping stale validation result ${RELEASE_SHA}; ${RELEASE_BRANCH} is now ${branch_sha}."
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists."
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [[ "${tag_sha}" != "${release_target}" ]]; then
              echo "Tag ${RELEASE_TAG} exists without a Release and points to ${tag_sha}, not ${release_target}." >&2
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} exists without a GitHub Release; refusing an ambiguous republish." >&2
            exit 1
          fi

          gh release create "${RELEASE_TAG}" \
            --target "${release_target}" \
            --title "${RELEASE_TAG}" \
            --generate-notes
          echo "created=true" >> "${GITHUB_OUTPUT}"

  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Dispatching another workflow needs actions: write. The dispatched run
      # performs the Trusted Publishing exchange itself: PyPI rejects OIDC
      # tokens whose claims come from a reusable-workflow call, so publishing
      # must happen in a top-level run of publish-pypi.yml.
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Dispatch the publish workflow
        shell: bash
        run: |
          gh workflow run publish-pypi.yml -R "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_BRANCH}" -f "release_tag=${RELEASE_TAG}"
          echo "Dispatched publish-pypi.yml for ${RELEASE_TAG} on ${RELEASE_BRANCH}."
      - name: Confirm the dispatched run started
        shell: bash
        run: |
          sleep 5
          gh run list -R "${GITHUB_REPOSITORY}" --workflow=publish-pypi.yml \
            --event=workflow_dispatch --limit=1 \
            --json url,status,headBranch \
            --jq '.[] | "publish run: \(.url) [\(.status)] branch=\(.headBranch)"'
