name: AKBridge automated validation and maintenance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: akbridge-maintenance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install dependencies
        run: uv sync --group dev --python "${{ matrix.python-version }}"
      - name: Run deterministic tests
        run: uv run --no-sync python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install dependencies
        run: uv sync --group dev --python "3.11"
      - name: Check Python lint rules
        run: uv run --no-sync ruff check src tests
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check src tests

  offline-contract:
    needs: [tests, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The baseline refresh step pushes regenerated contract artifacts.
      contents: write
    env:
      # The checked-in manifest is generated with the repository's canonical
      # interpreter. Keep annotation rendering stable for strict comparison.
      UV_PYTHON: "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install dependencies
        run: uv sync --group dev --python "3.14"
      - name: Run offline per-interface acceptance
        run: >-
          uv run --no-sync akbridge-accept run --offline --workers 4
          --output artifacts/acceptance/runs/offline.json
      - name: Build version-matched AKShare documentation index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          akshare_version="$(uv run --no-sync python -c 'import akshare; print(akshare.__version__)')"
          akshare_tag="release-v${akshare_version}"
          akshare_ref="$(gh api "repos/akfamily/akshare/commits/${akshare_tag}" --jq .sha)"
          uv run --no-sync akbridge-docs build \
            --ref "${akshare_ref}" \
            --output src/akbridge/data/akshare-docs.json
          uv run --no-sync python -c \
            "import akshare; from akbridge.documents import load_builtin_document_chunks; assert load_builtin_document_chunks(expected_version=akshare.__version__)"
      - name: Refresh acceptance status with documentation coverage
        run: >-
          uv run --no-sync akbridge-accept report
          --run artifacts/acceptance/runs/offline.json
          --output-dir artifacts/acceptance
      - name: Build distributable package
        run: uv build
      - name: Verify distributions include the documentation index
        shell: bash
        run: |
          unzip -l dist/*.whl | grep 'akbridge/data/akshare-docs.json' >/dev/null
          tar -tzf dist/*.tar.gz | grep 'src/akbridge/data/akshare-docs.json' >/dev/null
      - name: Check catalog and MCP contract
        run: >-
          uv run --no-sync akbridge-maintain ci --strict
          --baseline artifacts/acceptance/manifest.json
          --current artifacts/maintenance/manifest.json
          --catalog artifacts/catalog.json
          --report artifacts/maintenance/latest.json
          --check-latest
      - name: Refresh baseline artifacts when the contract changed
        # The gate above validates the committed baseline first: a signature or
        # schema regression fails the job before this step can run, so only
        # additive and metadata drift reaches the refresh. The decision compares
        # the regenerated content with the committed files while ignoring
        # generation timestamps, so a passing gate refreshes exactly once and
        # catalog-only drift (a route-table change, for instance, leaves the
        # manifest fingerprint untouched) is committed as well. The push uses
        # GITHUB_TOKEN and therefore does not start a new workflow run; the
        # refresh is generated by the same job and interpreter that just ran the
        # gate, and the next run that reaches the default branch compares
        # against it.
        if: >-
          ${{ success() && github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        shell: bash
        run: |
          akshare_version="$(uv run --no-sync python -c 'import akshare; print(akshare.__version__)')"
          uv run --no-sync akbridge-maintain manifest --output artifacts/acceptance/manifest.json
          uv run --no-sync akbridge-maintain catalog --output artifacts/catalog.json
          if python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          paths = ("artifacts/acceptance/manifest.json", "artifacts/catalog.json")

          def load(path: str, committed: bool):
              if committed:
                  text = subprocess.run(
                      ["git", "show", f"HEAD:{path}"],
                      capture_output=True,
                      text=True,
                      check=True,
                  ).stdout
              else:
                  text = Path(path).read_text(encoding="utf-8")
              data = json.loads(text)
              data.pop("generated_at", None)
              return data

          sys.exit(0 if all(load(p, True) == load(p, False) for p in paths) else 1)
          PY
          then
            echo "The committed baseline already matches the discovered contract."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git add artifacts/acceptance/manifest.json artifacts/catalog.json
          git commit -m "chore: refresh acceptance baseline for akshare ${akshare_version}"
          git rebase "FETCH_HEAD"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Refreshed baseline for akshare ${akshare_version}; the next run on ${GITHUB_REF_NAME} compares against it."
      - name: Publish documentation coverage summary
        if: ${{ always() && hashFiles('artifacts/maintenance/latest.json') != '' }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/maintenance/latest.json").read_text(encoding="utf-8"))
          documentation = report.get("documentation", {})
          print("## AKShare documentation index")
          print(f"- Status: `{documentation.get('status', 'unavailable')}`")
          print(f"- Document chunks: {documentation.get('chunk_count', 0)}")
          print(
              "- Interface coverage: "
              f"{documentation.get('documented_interface_count', 0)}/"
              f"{documentation.get('interface_count', 0)} "
              f"({documentation.get('interface_coverage_percent', 0)}%)"
          )
          print(
              "- Complete document fields: "
              f"{documentation.get('complete_chunk_count', 0)}/"
              f"{documentation.get('chunk_count', 0)} "
              f"({documentation.get('chunk_field_coverage_percent', 0)}%)"
          )
          PY
      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: akbridge-maintenance-report
          if-no-files-found: ignore
          path: |
            artifacts/maintenance/
            artifacts/acceptance/
      - name: Upload package distributions
        uses: actions/upload-artifact@v7
        with:
          name: akbridge-distributions
          path: dist/
      - name: Upload AKShare documentation index
        uses: actions/upload-artifact@v7
        with:
          name: akshare-document-index
          path: src/akbridge/data/akshare-docs.json
