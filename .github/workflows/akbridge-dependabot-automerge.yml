name: AKBridge Dependabot auto-merge

on:
  workflow_run:
    workflows: ["AKBridge automated validation and maintenance"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: akbridge-dependabot-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge-akshare-update:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Validate and merge the AKShare update
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const associatedPullRequests = run.pull_requests ?? [];

            if (associatedPullRequests.length !== 1) {
              core.info(`Expected one associated PR, found ${associatedPullRequests.length}.`);
              return;
            }

            const pullNumber = associatedPullRequests[0].number;
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            if (pull.state !== "open" || pull.draft) {
              core.info("The associated PR is not an open, ready PR.");
              return;
            }
            if (pull.user?.login !== "dependabot[bot]") {
              core.info(`Ignoring PR author ${pull.user?.login ?? "unknown"}.`);
              return;
            }
            if (!pull.head.ref.startsWith("dependabot/uv/")) {
              core.info(`Leaving non-Dependabot uv PR for manual review: ${pull.head.ref}`);
              return;
            }
            if (pull.head.sha !== run.head_sha) {
              core.setFailed("The validated commit is no longer the PR head.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const allowedFiles = new Set(["pyproject.toml", "uv.lock"]);
            const changedFiles = files.map((file) => file.filename);
            const invalidFile = files.find(
              (file) => !allowedFiles.has(file.filename) || file.status === "removed",
            );
            if (invalidFile || !changedFiles.includes("pyproject.toml")) {
              core.setFailed(`Unexpected changed files: ${changedFiles.join(", ")}`);
              return;
            }

            async function readText(path, ref) {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref,
              });
              if (Array.isArray(data) || data.type !== "file" || !data.content) {
                throw new Error(`Unable to read ${path} at ${ref}.`);
              }
              return Buffer.from(data.content, "base64").toString("utf8");
            }

            // Scans the whole file, so the map also contains dev-group and
            // extra pins (ruff, pytest, twine). Those can only ever be rejected
            // by the policy table below; the allow-list in dependabot.yml keeps
            // the reachable set to akshare and mcp today.
            function extractPins(text) {
              const pins = {};
              for (const match of text.matchAll(/"([A-Za-z0-9._-]+)(==|>=)([^"\r\n]+)"/g)) {
                pins[match[1]] = { spec: match[2], version: match[3] };
              }
              return pins;
            }

            function parseStableVersion(version) {
              const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
              if (!match) {
                throw new Error(`Automatic merge requires a stable x.y.z version: ${version}`);
              }
              return match.slice(1).map(Number);
            }

            const baseText = await readText("pyproject.toml", pull.base.sha);
            const headText = await readText("pyproject.toml", pull.head.sha);
            const basePins = extractPins(baseText);
            const headPins = extractPins(headText);
            const changedPins = [
              ...new Set([...Object.keys(basePins), ...Object.keys(headPins)]),
            ].filter((name) => JSON.stringify(basePins[name]) !== JSON.stringify(headPins[name]));
            if (changedPins.length !== 1) {
              core.info(
                `Expected exactly one changed dependency pin, found ${changedPins.length}: ` +
                  `${changedPins.join(", ") || "none"}.`
              );
              return;
            }
            const dependency = changedPins[0];
            const baseVersion = basePins[dependency].version;
            const headVersion = headPins[dependency].version;
            if (basePins[dependency].spec !== "==" || headPins[dependency].spec !== "==") {
              core.notice(
                `Dependency ${dependency} is not an exact pin; leaving it for manual review.`
              );
              return;
            }
            // AKShare upgrades within the same major and MCP patch upgrades within
            // the same minor may merge automatically; everything else stays open.
            const allowMinorUpdate = { akshare: true, mcp: false }[dependency];
            if (allowMinorUpdate === undefined) {
              core.notice(`Dependency ${dependency} is outside the auto-merge policy.`);
              return;
            }
            const placeholder = `"${dependency}==__VERSION__"`;
            if (
              baseText.replace(`"${dependency}==${baseVersion}"`, placeholder) !==
              headText.replace(`"${dependency}==${headVersion}"`, placeholder)
            ) {
              core.setFailed("pyproject.toml contains changes other than the dependency pin.");
              return;
            }

            const baseParts = parseStableVersion(baseVersion);
            const headParts = parseStableVersion(headVersion);
            const comparison = headParts.findIndex((value, index) => value !== baseParts[index]);
            const isUpgrade = comparison >= 0 && headParts[comparison] > baseParts[comparison];
            if (!isUpgrade) {
              core.setFailed(`${dependency} ${baseVersion} -> ${headVersion} is not an upgrade.`);
              return;
            }
            if (baseParts[0] !== headParts[0]) {
              core.notice(`Major update ${baseVersion} -> ${headVersion} requires manual review.`);
              return;
            }
            if (!allowMinorUpdate && baseParts[1] !== headParts[1]) {
              core.notice(
                `${dependency} ${baseVersion} -> ${headVersion} is a minor update ` +
                  "and requires manual review."
              );
              return;
            }

            const displayName = { akshare: "AKShare", mcp: "mcp" }[dependency];
            const result = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              merge_method: "squash",
              sha: run.head_sha,
              commit_title: `chore: update ${displayName} to ${headVersion} (#${pullNumber})`,
              commit_message: "Validated by the complete AKBridge offline acceptance gate.",
            });
            if (!result.data.merged) {
              core.setFailed(result.data.message || "GitHub did not merge the PR.");
              return;
            }
            core.notice(`Merged ${displayName} ${baseVersion} -> ${headVersion}.`);
